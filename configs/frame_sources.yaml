# 프레임 추출 소스 정의 — labeling_spec_v1.md (2026-09-11 동결) 기준 재작성 라운드 4
#
# 이전 버전(라운드 2/3)은 실 영상과 챕터 정의 불일치로 폐기. 아래 6개 소스·4클래스만 남긴다.
# 기존 라운드의 pilot/xiaowei/scale cap, shorts holdout, sampling policy 는 모두 제거했다.
# 라벨링 매칭율 확인 후 필요 시 v2 라운드에서 재편입.
#
# 클래스 (labeling_spec_v1.md):
#   electrode_roll        검은 코팅면 + 구리/알루미늄 스트라이프가 있는 감긴 롤
#   prismatic_cell_tray   같은 모양 각형 셀이 정렬된 트레이/컨베이어
#   pouch_cell_tray       파우치 셀이 격자로 놓인 검은 트레이
#   mixing_tank           스테인리스 믹싱 탱크 본체

extraction:
  interval_seconds: 1        # 사용자 지시(라운드 4): 구간이 짧으므로 1s 밀도 통일
  output_root: data/frames

# v3_selected 출력 경로. 기존 data/frames/v{N}_unlabeled/ 는 건드리지 않는다.
# manifest 는 scripts/extract_frames.py 가 출력 루트 아래 manifest.csv 로 기록.
output:
  subdir: v3_selected
  layout: by_class            # data/frames/v3_selected/<class>/<source>_<series>_<idx>.jpg

sources:
  # === v1_source_h264.mp4 (Miracle Process, 36분) ===
  # 사용자 지시(라운드 4) 정확한 시각 매핑:
  #   00:00~01:00  mixing_tank
  #   03:30~03:55  mixing_tank
  #   05:00~05:25  electrode_roll
  #   08:00~08:55  electrode_roll
  #   10:00~11:00  electrode_roll
  #   26:00~30:00  pouch_cell_tray
  - id: v1
    video: data/raw_videos/v1_source_h264.mp4
    channel: Miracle Process
    duration_seconds: 2166
    resolution: 1920x1080
    chapters:
      - {start: 0,    end: 60,   class: mixing_tank,     series: v1_mx_a,
         note: "인트로 mixing 구간 (사용자 지시)"}
      - {start: 210,  end: 235,  class: mixing_tank,     series: v1_mx_b,
         note: "03:30~03:55 mixing 재확인 구간 (사용자 지시)"}
      - {start: 300,  end: 325,  class: electrode_roll,  series: v1_er_a,
         note: "05:00~05:25 electrode_roll (사용자 지시)"}
      - {start: 480,  end: 535,  class: electrode_roll,  series: v1_er_b,
         note: "08:00~08:55 electrode_roll (사용자 지시)"}
      - {start: 600,  end: 660,  class: electrode_roll,  series: v1_er_c,
         note: "10:00~11:00 electrode_roll (사용자 지시)"}
      - {start: 1560, end: 1800, class: pouch_cell_tray, series: v1_pt_a,
         note: "26:00~30:00 pouch_cell_tray (사용자 지시)"}

  # === v10 (Xiaowei New Energy, Prismatic Cell Production) ===
  # 사용자 지시: 00:00~05:25 전 구간 편입, 라벨링 시 스킵 기준으로 필터.
  # 스크러빙 이력(v10_index.txt)에 따르면 #24~#63 구간(약 4:00~10:30 원본)에 각형 셀·모듈 트레이가 집중.
  # 여기서는 05:25까지만. 이후 구간은 assembly/packaging 위주로 라벨 대상 아님.
  - id: v10
    video: data/raw_videos/v10_5AOD.mp4
    channel: Xiaowei New Energy
    duration_seconds: 326
    resolution: 1920x1080
    chapters:
      - {start: 0, end: 325, class: prismatic_cell_tray, series: v10_pcm_a,
         note: "전 구간 편입(사용자 지시). 스킵 기준으로 라벨링 시 필터 예상"}

  # === v4 (CATL 공식, 4:16 홍보) ===
  # electrode_roll 재확인(2026-09-11 라운드 4):
  #   #12 (2:00) "80 Meters Per Minute" 웹 원경 — marginal
  #   #13 (2:05) jumbo electrode rolls 두 개 감김 클로즈업 — **gold**
  #   #14 (2:08~2:10) presenter 뒤 rolls 다수 — **gold**
  # 이후 t132~140 은 CG 웹 이송 → 감긴 롤 정의 벗어남.
  - id: v4
    video: data/raw_videos/v4_hmhH.mp4
    channel: CATL
    duration_seconds: 257
    resolution: 1920x1080
    chapters:
      - {start: 118, end: 135, class: electrode_roll, series: v4_er_a,
         note: "2:00~2:15 jumbo electrode rolls 정면. 근거: t125 rolls 두 개 감김, t128/130 presenter+rolls"}

  # === v5 (How It's Made — Lithium Battery Company, 2:19) ===
  # 사용자 지시: electrode_roll 이 보이는 구간만.
  # 재확인 결과 전 구간에서 감긴 electrode roll 정면 클로즈업 부재:
  #   #10 (0:20) 코팅 드럼 위 검은 필름 이송, 우측 감긴 롤은 절반 이상 가려짐 → labeling spec 스킵 기준
  #   #22 (0:45) 셀 이송 컷팅, #30 (1:00) 판넬, #45~ 완제품 홍보
  # electrode_roll 매칭 가능 프레임 없다고 판단하여 skip. 재도입 시 아래 시각 참고.
  - id: v5
    video: data/raw_videos/v5_UHZg.mp4
    channel: How It's Made
    duration_seconds: 139
    resolution: 1920x1080
    excluded_reason: |
      2026-09-11 라운드 4 재확인: 전 구간에서 electrode_roll (감긴 롤) 정면 클로즈업 부재.
      코팅 드럼 위 검은 필름 이송은 있으나 감긴 롤 자체는 절반 이상 가려져 스킵 기준 위배.
      나머지 구간은 컷팅/셀 트레이 이송/완제품 배터리 홍보.
    chapters: []

  # === v15 (Wei-Hang Automation, 6초) ===
  # 6초 원본. Overview + 실 프레임(t1, t3, t5) 확인 결과 슬리팅 원반 정면 UI 만 등장.
  # electrode_roll 정의(감긴 롤) 부재. skip.
  - id: v15
    video: data/raw_videos/v15_zbHP.mp4
    channel: Wei-Hang Automation
    duration_seconds: 6
    resolution: 1920x1080
    excluded_reason: |
      2026-09-11 라운드 4 확인: 6초 전체가 슬리팅 원반 + 컨트롤 판넬. electrode_roll 부재.
    chapters: []

  # === v17 (AutoMotoTV — VW Salzgitter, 60초) ===
  # electrode_roll gold 다수 확인(2026-09-11 라운드 4):
  #   #05 (0:25) 감긴 롤 정면 (yellow zebra frame)   → gold
  #   #07 (0:35) 완벽한 electrode_roll 클로즈업       → gold
  #   #09 (0:45) 초록 심축 + 감긴 롤                  → gold
  #   #11 (0:55) 감긴 롤 끝단 + 심축                  → gold
  # 원경 (#01 0:05, #03 0:15) 은 라벨링 시 스킵 예상.
  - id: v17
    video: data/raw_videos/v17_Stjc.mp4
    channel: AutoMotoTV — VW Salzgitter
    duration_seconds: 60
    resolution: 1920x1080
    chapters:
      - {start: 13, end: 59, class: electrode_roll, series: v17_er_a,
         note: "0:13~0:59 electrode_roll. gold cells #05/#07/#09/#11 (t25/t35/t45/t55)"}
