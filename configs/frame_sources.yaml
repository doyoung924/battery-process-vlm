# 프레임 추출 소스 정의 — Phase D (scripts/extract_frames.py) 가 이 config 를 iterate
# 챕터 시각·클래스 매핑 근거: experiments/labeling_plan.md
# Xiaowei 편중 방침 근거: experiments/relabel_progress.md "Phase B 확장 — 다운로드 완료 (2026-09-01)"

extraction:
  interval_seconds: 2.5   # 기존 extract_coating_frames.py 정책 유지 (v1 대비 통일)
  output_root: data/frames

# 팩토리 스케일 우선 정책 (2026-09-01 확정)
# 근거: test = v3_zbBx (Processlytic 팩토리 편집물) → train 도 팩토리 정합 필요.
# pilot 스케일(연구실/파일럿 라인) 프레임은 도메인 다양성 목적으로만 소량 편입.
policy:
  scale_cap:
    pilot_ratio_max: 0.30       # 클래스당 pilot 스케일 프레임 30% 상한
    class_exceptions:
      roll_press: null          # 2026-09-08 예외: roll_press 자원 절대 부족 (기존 v1 단독 29장 + v17 test 10장)
                                # → shorts s3(Motoma Calendering) + s14(Xiaowei) sources 편입 허용, pilot ratio cap 미적용
  channel_cap:
    xiaowei_ratio_max: 0.20     # 클래스당 Xiaowei 채널 프레임 20% 상한 (편중 방지)
  enforcement: "scripts/select_frames.py 에서 클래스별 카운트 후 warning (assert 아님)"
  # 2026-09-01 상황: v10 스크러빙 후 배제로 Xiaowei train 편입은 0.
  # 2026-09-08 상황: s14 (Xiaowei 세로 shorts) roll_press 로 편입 — xiaowei ratio 위배 여부는 확보량에 따라 재검토.

sources:
  # === 팩토리 스케일 (train 주력) ===

  - id: v1
    video: data/raw_videos/v1_source_h264.mp4
    channel: Miracle Process
    channel_pool: factory
    scale: factory
    split: train
    duration_seconds: 2166
    resolution: 1920x1080
    status: pre-extracted
    # data/frames/v1_unlabeled/ 에 이미 클래스별로 분류돼 있음.
    # select_frames.py 는 v1_unlabeled 를 직접 참조하므로 chapters 스킵.
    chapters: []
    reference_chapters:
      - {start: 34,   end: 770,  region: "coating+calendering+slitting"}
      - {start: 770,  end: 1825, region: "winding+encapsulation"}
      - {start: 1825, end: 2165, region: "assembly+test", skip: true}

  - id: v2
    video: data/raw_videos/v2_j1jW.mp4
    channel: Everything Electric — Zeekr Z Factory
    channel_pool: factory
    scale: factory
    split: test           # 2026-09-01 승격: v3 배제로 test 재배정
    duration_seconds: 650
    resolution: 1920x960
    chapters:
      - {start: 142, end: 183, class: coating_die, series: coat_j1jW}
      # 2026-09-02 스크러빙 결과 아래 두 chapter 는 4클래스 매칭 없음 → skip
      - {start: 183, end: 217, series: hair_j1jW, skip: true, note: "'Half a width of a human hair' 챕터. 인터뷰 + electrode jumbo roll (심축 winding 아님)"}
      - {start: 243, end: 349, series: rp_j1jW,   skip: true, note: "'Rolling 2.2M cells' 챕터. 완제품 로고(Tesla/VW/GM/Kia/CATL) + jumbo electrode roll + 셀 assembly. 4클래스 클로즈업 없음"}

  - id: v3
    video: data/raw_videos/v3_zbBx.mp4
    channel: Processlytic
    channel_pool: factory
    scale: factory
    split: excluded       # 2026-09-01 배제 (스크러빙 결과)
    duration_seconds: 992
    resolution: 3840x2160
    excluded_reason: |
      스크러빙(30s 간격 34셀) 결과 편집물 홍보영상으로 확인.
