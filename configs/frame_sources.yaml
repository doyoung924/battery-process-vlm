    channel_pool: factory
    scale: factory
    split: train
    duration_seconds: 139
    resolution: 1920x1080
    caveat: "CG/애니메이션 삽입 있음 → 추출 후 실사 필터링 필요"
    chapters:
      - {start: 13, end: 41, class: coating_die,    series: coat_UHZg}
      - {start: 41, end: 51, class: slitting_knife, series: sl_UHZg,   note: "CUTTING 챕터 — slitting vs notching 확인 필요"}
      - {start: 51, end: 69, class: winding_core,   series: wi_UHZg,   note: "ASSEMBLY 챕터 — cell winding 확인 필요"}

