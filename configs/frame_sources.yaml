  - id: v10
    video: data/raw_videos/v10_5AOD.mp4
    channel: Xiaowei New Energy
    channel_pool: xiaowei
    scale: pilot
    split: excluded       # 2026-09-01 배제 (스크러빙 결과)
    duration_seconds: 326
    resolution: 1920x1080
    excluded_reason: |
      스크러빙(10s 간격 33셀) 결과 4클래스와 완전히 무관한 구간뿐 확인.
      "Prismatic Cell Production" 은 앞단(전극 제조: 코팅/롤/슬리팅) 이 아니라
      후단(각형 셀 조립/케이싱/패키징)만 다룬 영상.
      전 구간이 assembly + robot arm + 트레이 이송 + 라벨링 + 케이싱 + 완제품 정렬.
      부가 효과: Xiaowei train 편입이 0 이 되어 편중 리스크 자동 해소.

