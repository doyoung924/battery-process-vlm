      #   #03-#07 (0:15-0:35): calendering 원반 롤러 클로즈업 → roll_press
      #   #08-#11 (0:40-0:55): 슬리팅 축·잘린 필름 → slitting_knife
      - {start: 13, end: 37, class: roll_press,     series: rp_Stjc, note: "calendering 원반 롤러 두 개"}
      - {start: 38, end: 59, class: slitting_knife, series: sl_Stjc, note: "슬리팅 원반 축 + 잘린 필름"}

